<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Exile Message</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 16px; }
    #play-hint { color: #666; display: none; }
    #loop-btn { margin-top: 12px; padding: 8px 16px; font-size: 16px; border-radius: 8px; border: 1px solid #888; background: #f2f2f2; cursor: pointer; }
    #loop-btn.on { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  </style>
</head>
<body>
  <h1>The Exile Message</h1>

  <!-- Plays automatically when the page opens -->
  <audio id="exile-audio" src="exile-therapy.mp3" autoplay controls></audio>
  <br>
  <button id="loop-btn" type="button" aria-pressed="false">Loop: Off</button>
  <p id="play-hint">Click anywhere to start the audio.</p>

  <script>
    // Most browsers block sound until the visitor interacts with the page.
    // If autoplay is blocked, start the audio on the first click or key press.
    const audio = document.getElementById('exile-audio');
    const hint = document.getElementById('play-hint');
    const loopBtn = document.getElementById('loop-btn');

    // Loop button: turns repeating on and off
    loopBtn.addEventListener('click', () => {
      audio.loop = !audio.loop;
      loopBtn.textContent = audio.loop ? 'Loop: On' : 'Loop: Off';
      loopBtn.classList.toggle('on', audio.loop);
      loopBtn.setAttribute('aria-pressed', audio.loop);
    });

    function startAudio() {
      audio.play().then(() => {
        hint.style.display = 'none';
        document.removeEventListener('click', startAudio);
        document.removeEventListener('keydown', startAudio);
      }).catch(() => {});
    }

    audio.play().catch(() => {
      hint.style.display = 'block';
      document.addEventListener('click', startAudio);
      document.addEventListener('keydown', startAudio);
    });
  </script>
</body>
</html>
